<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>CM2-NeuronalSignal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <canvas id="map-background" class="fullscreen-background" aria-hidden="true"></canvas>
    <div id="map-plot" class="fullscreen-map" tabindex="0" aria-label="Full field-of-view neuron map" data-interaction-command="map-pan map-zoom-in map-zoom-out map-fit"></div>
    <div class="map-system-gesture-gutter map-system-gesture-gutter-left" aria-hidden="true"></div>
    <div class="map-system-gesture-gutter map-system-gesture-gutter-right" aria-hidden="true"></div>
    <div id="status-banner" class="status-banner" role="status" aria-live="polite" aria-atomic="true">Loading cache...</div>

    <aside class="overlay-stack">
      <div id="workflow-panel" class="workflow-panel">
        <div class="workflow-panel-content">
        <section id="background-section" class="glass-panel workflow-section" data-workflow-section="background">
          <button class="workflow-section-header" type="button" data-section-toggle="background" data-control-description="Show or hide background controls">
            <span>Background</span>
          </button>
          <div class="workflow-section-body">
            <div class="background-toolbar-row">
              <div id="background-picker" class="background-picker">
                <button id="background-select" class="background-select" type="button" aria-haspopup="listbox" aria-controls="background-menu" aria-expanded="false" data-control-description="Choose the image shown behind the neuron map">
                  <span id="background-select-label" class="background-select-label"></span>
                </button>
                <div id="background-menu" class="background-menu anchored-popover floating-surface hidden" role="listbox" aria-label="Background image" aria-orientation="vertical"></div>
              </div>
              <div id="background-range" class="background-range hidden">
                <div class="background-range-values" aria-hidden="true">
                  <span id="background-range-lower-label"></span>
                  <span id="background-range-center-label">Color Map</span>
                  <span id="background-range-upper-label"></span>
                </div>
                <div class="background-range-slider" role="group" aria-label="Background Color Map range">
                  <div class="background-range-track"></div>
                  <div id="background-range-fill" class="background-range-fill"></div>
                  <input id="background-range-lower-input" class="background-range-input background-range-input-lower" type="range" aria-label="Minimum background Color Map value">
                  <input id="background-range-upper-input" class="background-range-input background-range-input-upper" type="range" aria-label="Maximum background Color Map value">
                </div>
              </div>
            </div>
          </div>
        </section>

        <section id="qc-section" class="glass-panel workflow-section" data-workflow-section="qc">
          <button class="workflow-section-header" type="button" data-section-toggle="qc" data-control-description="Show or hide neuron filtering controls by metric">
            <span>Neuron Filter by Metric</span>
          </button>
          <div class="workflow-section-body qc-card">
            <div class="qc-controls">
              <div class="qc-toolbar-row">
                <div id="blueprint-picker" class="blueprint-picker">
                  <button id="blueprint-select" class="blueprint-select" type="button" aria-haspopup="listbox" aria-controls="blueprint-menu" aria-expanded="false" data-control-description="Choose a neuron metric for colors, filtering, and the histogram">
                    <span id="blueprint-select-label" class="blueprint-select-label">None</span>
                  </button>
                  <div id="blueprint-menu" class="blueprint-menu anchored-popover floating-surface hidden" role="listbox" aria-label="Neuron Metric" aria-orientation="vertical"></div>
                </div>
                <div id="blueprint-qc-range" class="qc-inline-range qc-threshold-range hidden">
                  <div class="qc-range-values">
                    <span id="qc-range-lower-label"></span>
                    <span class="qc-range-label">Threshold</span>
                    <span id="qc-range-upper-label"></span>
                  </div>
                  <div class="qc-range-slider">
                    <div class="qc-range-track"></div>
                    <div id="qc-range-fill" class="qc-range-fill"></div>
                    <input id="qc-range-lower-input" class="qc-range-input qc-range-input-lower" type="range" aria-label="Lower threshold" data-control-description="Set the lower raw-value limit; the far left means no lower limit">
                    <input id="qc-range-upper-input" class="qc-range-input qc-range-input-upper" type="range" aria-label="Upper threshold" data-control-description="Set the upper raw-value limit; the far right means no upper limit">
                  </div>
                </div>
              </div>
            </div>
            <div class="qc-histogram-stage">
              <div id="blueprint-stats-plot" class="blueprint-stats-plot hidden"></div>
              <div id="qc-histogram-range-preview" class="qc-histogram-range-preview hidden" aria-hidden="true">
                <div class="qc-histogram-range-shade qc-histogram-range-shade-lower"></div>
                <div class="qc-histogram-range-shade qc-histogram-range-shade-upper"></div>
                <div class="qc-histogram-range-bound qc-histogram-range-bound-lower"></div>
                <div class="qc-histogram-range-bound qc-histogram-range-bound-upper"></div>
              </div>
            </div>
            <div id="qc-download-row" class="plot-download-row qc-download-row hidden">
              <div id="blueprint-color-range" class="qc-inline-range hidden">
                <div class="qc-range-values">
                  <span id="qc-color-lower-label"></span>
                  <span class="qc-range-label">Color Map</span>
                  <span id="qc-color-upper-label"></span>
                </div>
                <div class="qc-range-slider">
                  <div class="qc-range-track"></div>
                  <div id="qc-color-fill" class="qc-range-fill qc-color-fill"></div>
                  <input id="qc-color-lower-input" class="qc-range-input qc-range-input-lower" type="range" aria-label="Lower color mapping bound" data-control-description="Set the lower endpoint of the neuron color scale">
                  <input id="qc-color-upper-input" class="qc-range-input qc-range-input-upper" type="range" aria-label="Upper color mapping bound" data-control-description="Set the upper endpoint of the neuron color scale">
                </div>
              </div>
              <div class="plot-download-actions">
                <button id="download-qc-svg-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download this histogram as SVG">SVG</button>
                <button id="download-qc-png-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download this histogram as PNG">PNG</button>
              </div>
            </div>
          </div>
        </section>

        <section class="glass-panel workflow-section" data-workflow-section="region">
          <button class="workflow-section-header" type="button" data-section-toggle="region" data-control-description="Show or hide neuron filtering controls by region and neuron counts">
            <span>Neuron Filter by Region</span>
          </button>
          <div class="workflow-section-body">
            <div id="region-list" class="region-list"></div>
          </div>
        </section>

        <section id="roi-section" class="glass-panel workflow-section" data-workflow-section="roi">
          <button class="workflow-section-header" type="button" data-section-toggle="roi" data-control-description="Show or hide region-of-interest controls (ROI)">
            <span>ROI</span>
          </button>
          <div class="workflow-section-body">
            <div id="roi-workflow-panel" class="roi-workflow-panel"></div>
          </div>
        </section>

        <section class="glass-panel workflow-section" data-workflow-section="temporalHeatmap">
          <button class="workflow-section-header" type="button" data-section-toggle="temporalHeatmap" data-control-description="Show or hide the active ROI heatmap">
            <span>Temporal: Heatmap</span>
          </button>
          <div class="workflow-section-body trace-section-body">
            <div class="source-panel temporal-toggle-row">
              <div id="heatmap-source-toggle" class="trace-source-toggle"></div>
              <div id="heatmap-value-toggle" class="trace-source-toggle"></div>
            </div>

            <section class="plot-panel heatmap-plot-panel">
              <div class="plot-scroll heatmap-plot-scroll">
                <div id="c-heatmap-plot" class="plot-frame"></div>
              </div>
              <div class="plot-download-row heatmap-download-row">
                <div id="heatmap-colorbar" class="heatmap-colorbar hidden"></div>
                <div class="plot-download-actions">
                  <button id="download-heatmap-svg-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download the heatmap and colorbar as SVG">SVG</button>
                  <button id="download-heatmap-png-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download the heatmap and colorbar as PNG">PNG</button>
                </div>
              </div>
            </section>
          </div>
        </section>

        <section class="glass-panel workflow-section" data-workflow-section="temporalTrace">
          <button class="workflow-section-header" type="button" data-section-toggle="temporalTrace" data-control-description="Show or hide temporal traces for selected neurons">
            <span>Temporal: Trace</span>
          </button>
          <div class="workflow-section-body trace-section-body">
            <div class="source-panel temporal-toggle-row">
              <div id="trace-source-toggle" class="trace-source-toggle"></div>
              <div id="trace-value-toggle" class="trace-source-toggle"></div>
            </div>

            <section class="plot-panel trace-plot-panel">
              <div class="plot-scroll trace-plot-scroll">
                <div id="c-trace-plot" class="plot-frame"></div>
              </div>
              <button id="trace-deselect-btn" class="mini-btn roi-row-delete trace-deselect-btn hidden" type="button" aria-label="Deselect trace neuron"><span class="roi-row-action-visual" aria-hidden="true"></span></button>
              <div class="plot-download-row trace-download-row">
                <div id="trace-scale-controls" class="trace-scale-controls hidden"></div>
                <div class="plot-download-actions">
                  <button id="download-trace-svg-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download the displayed traces as SVG">SVG</button>
                  <button id="download-trace-png-btn" class="mini-btn plot-download-btn" type="button" data-control-description="Download the displayed traces as PNG">PNG</button>
                </div>
              </div>
            </section>
          </div>
        </section>
        <div id="workflow-state-actions" class="workflow-state-actions" role="group" aria-label="Viewer state actions" aria-hidden="true" hidden inert>
          <button id="clear-all-btn" class="mini-btn workflow-state-action" type="button" data-control-description="Reset all viewer settings and selections to a clean state">Clear All</button>
          <button id="restore-default-btn" class="mini-btn workflow-state-action hidden" type="button" aria-hidden="true" data-control-description="Replace all viewer settings and selections with the configured Default Profile">Restore Default</button>
        </div>
        </div>
      </div>

      <div id="overlay-resizer" class="overlay-resizer" aria-hidden="true" data-control-description="Drag to resize the control panel; double-click to reset it"></div>
    </aside>

  </div>

  <script src="/vendor/plotly.min.js"></script>
  <dialog id="shortcut-help-dialog" class="confirmation-dialog shortcut-help-dialog" aria-labelledby="shortcut-help-title" aria-describedby="shortcut-help-description">
    <h4 id="shortcut-help-title" class="confirmation-dialog-title">Keyboard and Gesture Help</h4>
    <p id="shortcut-help-description" class="confirmation-dialog-description">Available commands depend on the currently focused viewer area.</p>
    <div id="shortcut-help-groups" class="shortcut-help-groups"></div>
    <div class="confirmation-dialog-actions shortcut-help-actions">
      <button id="shortcut-help-close-btn" class="mini-btn" type="button">Close</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
