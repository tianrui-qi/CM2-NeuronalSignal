<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CM2 Neuron Viewer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="map-plot" class="fullscreen-map"></div>
    <div id="status-banner" class="status-banner">Loading cache...</div>

    <aside class="overlay-stack">
      <div id="workflow-panel" class="workflow-panel">
        <div class="workflow-panel-content">
        <section id="background-section" class="glass-panel workflow-section" data-workflow-section="background">
          <button class="workflow-section-header" type="button" data-section-toggle="background">
            <span>Background</span>
            <span id="background-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body background-card">
            <div id="background-options" class="background-options" role="group" aria-label="Background"></div>
          </div>
        </section>

        <section id="qc-section" class="glass-panel workflow-section" data-workflow-section="qc">
          <button class="workflow-section-header" type="button" data-section-toggle="qc">
            <span>Quality Control</span>
            <span id="qc-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body qc-card">
            <div class="qc-controls">
              <div class="qc-control-row qc-unit-row">
                <div id="blueprint-picker" class="blueprint-picker">
                  <button id="blueprint-select" class="blueprint-select" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="blueprint-select-label" class="blueprint-select-label">None</span>
                  </button>
                  <div id="blueprint-menu" class="blueprint-menu hidden" role="listbox" aria-label="Neuron Blueprint"></div>
                </div>
                <div id="qc-unit-mode" class="qc-unit-toggle" role="radiogroup" aria-label="Quality control units">
                  <button class="qc-unit-btn" type="button" data-qc-unit-mode="std" role="radio">STD</button>
                  <button class="qc-unit-btn" type="button" data-qc-unit-mode="raw" role="radio">Raw</button>
                </div>
              </div>
              <div id="blueprint-color-range" class="qc-inline-range qc-range-row hidden">
                <div class="qc-range-values">
                  <span id="qc-color-lower-label"></span>
                  <span class="qc-range-label">Color Map</span>
                  <span id="qc-color-upper-label"></span>
                </div>
                <div class="qc-range-slider">
                  <div class="qc-range-track"></div>
                  <div id="qc-color-fill" class="qc-range-fill qc-color-fill"></div>
                  <input id="qc-color-lower-input" class="qc-range-input qc-range-input-lower" type="range" aria-label="Lower color mapping bound">
                  <input id="qc-color-upper-input" class="qc-range-input qc-range-input-upper" type="range" aria-label="Upper color mapping bound">
                </div>
              </div>
              <div id="blueprint-qc-range" class="qc-inline-range qc-range-row qc-threshold-range hidden">
                <div class="qc-range-values">
                  <span id="qc-range-lower-label"></span>
                  <span class="qc-range-label">Threshold</span>
                  <span id="qc-range-upper-label"></span>
                </div>
                <div class="qc-range-slider">
                  <div class="qc-range-track"></div>
                  <div id="qc-range-fill" class="qc-range-fill qc-threshold-fill"></div>
                  <input id="qc-range-lower-input" class="qc-range-input qc-range-input-lower" type="range" aria-label="Lower threshold">
                  <input id="qc-range-upper-input" class="qc-range-input qc-range-input-upper" type="range" aria-label="Upper threshold">
                </div>
              </div>
            </div>
            <div id="blueprint-stats-plot" class="blueprint-stats-plot hidden"></div>
            <div id="qc-download-row" class="plot-download-row qc-download-row hidden">
              <div class="plot-download-actions">
                <button id="download-qc-svg-btn" class="mini-btn plot-download-btn" type="button">SVG</button>
                <button id="download-qc-png-btn" class="mini-btn plot-download-btn" type="button">PNG</button>
              </div>
            </div>
          </div>
        </section>

        <section id="region-section" class="glass-panel workflow-section" data-workflow-section="region">
          <button class="workflow-section-header" type="button" data-section-toggle="region">
            <span>Region</span>
            <span id="region-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body region-card">
            <div id="region-list" class="region-list"></div>
          </div>
        </section>

        <section id="roi-section" class="glass-panel workflow-section" data-workflow-section="roi">
          <button class="workflow-section-header" type="button" data-section-toggle="roi">
            <span>ROI</span>
            <span id="roi-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body">
            <div id="roi-workflow-panel" class="roi-workflow-panel"></div>
          </div>
        </section>

        <section id="temporal-heatmap-section" class="glass-panel workflow-section" data-workflow-section="temporalHeatmap">
          <button class="workflow-section-header" type="button" data-section-toggle="temporalHeatmap">
            <span>Temporal: Heatmap</span>
            <span id="temporal-heatmap-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body trace-section-body">
            <div class="source-panel temporal-toggle-row">
              <div id="heatmap-source-toggle" class="trace-source-toggle"></div>
              <div id="heatmap-value-toggle" class="trace-source-toggle"></div>
            </div>

            <div id="heatmap-colorbar" class="heatmap-colorbar hidden"></div>

            <section class="plot-panel heatmap-plot-panel">
              <div class="plot-scroll heatmap-plot-scroll">
                <div id="c-heatmap-plot" class="plot-frame"></div>
              </div>
              <div class="plot-download-row">
                <button id="download-heatmap-svg-btn" class="mini-btn plot-download-btn" type="button">SVG</button>
                <button id="download-heatmap-png-btn" class="mini-btn plot-download-btn" type="button">PNG</button>
              </div>
            </section>
          </div>
        </section>

        <section id="temporal-trace-section" class="glass-panel workflow-section" data-workflow-section="temporalTrace">
          <button class="workflow-section-header" type="button" data-section-toggle="temporalTrace">
            <span>Temporal: Trace</span>
            <span id="temporal-trace-section-summary" class="workflow-section-summary"></span>
          </button>
          <div class="workflow-section-body trace-section-body">
            <div class="source-panel temporal-toggle-row">
              <div id="trace-source-toggle" class="trace-source-toggle"></div>
              <div id="trace-value-toggle" class="trace-source-toggle"></div>
            </div>

            <div id="trace-operation-row" class="trace-operation-row hidden">
              <button id="trace-select-all-btn" class="mini-btn trace-select-all-btn" type="button">Select All</button>
              <div id="trace-operation-controls" class="trace-operation-controls"></div>
            </div>
            <div id="trace-scale-controls" class="trace-scale-controls hidden"></div>

            <section class="plot-panel trace-plot-panel">
              <div class="plot-scroll trace-plot-scroll">
                <div id="c-trace-plot" class="plot-frame"></div>
              </div>
              <div class="plot-download-row trace-download-row">
                <div class="plot-download-actions">
                  <button id="download-trace-svg-btn" class="mini-btn plot-download-btn" type="button">SVG</button>
                  <button id="download-trace-png-btn" class="mini-btn plot-download-btn" type="button">PNG</button>
                </div>
              </div>
            </section>
          </div>
        </section>
        </div>
      </div>

      <div id="overlay-resizer" class="overlay-resizer" aria-hidden="true"></div>
    </aside>

  </div>

  <script src="/vendor/plotly.min.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/region.js"></script>
  <script src="/js/qc.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/roi.js"></script>
  <script src="/js/trace.js"></script>
  <script src="/js/workflow.js"></script>
  <script src="/js/cache.js"></script>
  <script src="/app.js"></script>
</body>
</html>
